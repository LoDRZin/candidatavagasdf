<article class="resume-page template-columns">
  <header class="resume-header"><div class="resume-title"><p class="resume-label">CURRÍCULO</p><h1 data-field="profile.name"></h1><p class="resume-headline" data-field="profile.headline"></p></div><div class="resume-contact"><span data-field="profile.email"></span><span data-field="profile.phone"></span><span data-field="profile.location"></span><span data-field="profile.website"></span></div></header>
  <div class="resume-grid"><main>
    <section data-section="summary"><h2>Perfil</h2><p data-field="summary"></p></section>
    <section data-section="experiences"><h2>Experiência</h2><div data-repeat="experiences"><template data-item><article class="resume-entry"><div class="resume-entry-top"><h3 data-field="role"></h3><span data-field="dateRange"></span></div><p class="resume-subline"><span data-field="company"></span><span data-field="location"></span></p><ul data-repeat="bullets"><template data-item><li data-text="true"></li></template></ul></article></template></div></section>
    <section data-section="education"><h2>Formação</h2><div data-repeat="education"><template data-item><article class="resume-entry"><div class="resume-entry-top"><h3 data-field="course"></h3><span data-field="dateRange"></span></div><p class="resume-subline"><span data-field="institution"></span><span data-field="status"></span></p></article></template></div></section>
    <section data-section="projects"><h2>Projetos</h2><div data-repeat="projects"><template data-item><article class="resume-entry"><h3 data-field="title"></h3><p data-field="description"></p><p data-field="link"></p></article></template></div></section>
  </main><aside>
    <section data-section="certifications"><h2>Cursos</h2><div data-repeat="certifications"><template data-item><article class="resume-entry"><h3 data-field="name"></h3><p class="resume-subline"><span data-field="issuer"></span><span data-field="dateLabel"></span></p></article></template></div></section>
    <section data-section="skills"><h2>Competências</h2><ul data-repeat="skills"><template data-item><li data-text="true"></li></template></ul></section>
    <section data-section="languages"><h2>Idiomas</h2><ul data-repeat="languages"><template data-item><li data-text="true"></li></template></ul></section>
  </aside></div>
</article>
