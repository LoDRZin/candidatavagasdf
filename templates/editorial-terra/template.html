<article class="resume-page template-terra">
  <header class="resume-header"><div class="resume-heading"><p class="resume-label">TRAJETÓRIA</p><h1 data-field="profile.name"></h1><p class="resume-headline" data-field="profile.headline"></p></div><div class="resume-contact"><span data-field="profile.email"></span><span data-field="profile.phone"></span><span data-field="profile.location"></span><span data-field="profile.website"></span></div></header>
  <section data-section="summary"><h2>Apresentação</h2><p data-field="summary"></p></section>
  <section data-section="experiences"><h2>Experiência profissional</h2><div data-repeat="experiences"><template data-item><article class="resume-entry"><div class="resume-entry-top"><h3 data-field="role"></h3><span data-field="dateRange"></span></div><p class="resume-subline"><span data-field="company"></span><span data-field="location"></span></p><ul data-repeat="bullets"><template data-item><li data-text="true"></li></template></ul></article></template></div></section>
  <section data-section="education"><h2>Formação</h2><div data-repeat="education"><template data-item><article class="resume-entry"><div class="resume-entry-top"><h3 data-field="course"></h3><span data-field="dateRange"></span></div><p class="resume-subline"><span data-field="institution"></span><span data-field="status"></span></p></article></template></div></section>
  <section data-section="projects"><h2>Projetos e atividades</h2><div data-repeat="projects"><template data-item><article class="resume-entry"><h3 data-field="title"></h3><p data-field="description"></p><p data-field="link"></p></article></template></div></section>
  <section data-section="certifications"><h2>Formação complementar</h2><div data-repeat="certifications"><template data-item><article class="resume-entry"><div class="resume-entry-top"><h3 data-field="name"></h3><span data-field="dateLabel"></span></div><p data-field="issuer"></p></article></template></div></section>
  <div class="resume-foot"><section data-section="skills"><h2>Competências</h2><p data-list="skills"></p></section><section data-section="languages"><h2>Idiomas</h2><p data-list="languages"></p></section></div>
</article>
